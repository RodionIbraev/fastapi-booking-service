x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://booking:booking@postgres:5432/booking
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: prod
    environment:
      <<: *app-env
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: prod
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
